name: Documentation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'engineering/**'
      - 'docs_theme/**'
      - 'mkdocs*.yml'
      - 'requirements-docs.txt'
      - 'scripts/build_docs.py'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main, feat/preparation-coach]
    paths:
      - 'docs/**'
      - 'engineering/**'
      - 'docs_theme/**'
      - 'mkdocs*.yml'
      - 'requirements-docs.txt'
      - 'scripts/build_docs.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build both portals and validate links/search separation
        run: python scripts/build_docs.py
      - name: Select publication source
        id: publication
        uses: actions/github-script@v7
        with:
          script: |
            let publish = context.ref === 'refs/heads/main' || context.eventName === 'workflow_dispatch';
            // Bootstrap this requested site before the application PR is merged.
            // Once main contains MkDocs, feature-branch pushes never overwrite it.
            if (context.eventName === 'push' && context.ref === 'refs/heads/feat/preparation-coach') {
              try {
                await github.rest.repos.getContent({ ...context.repo, path: 'mkdocs.yml', ref: 'main' });
              } catch (error) {
                if (error.status !== 404) throw error;
                publish = true;
              }
            }
            core.setOutput('publish', String(publish));
      - name: Upload reviewed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site
      - name: Upload Pages artifact
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
