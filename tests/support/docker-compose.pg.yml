# Throwaway Postgres with pgvector for the app's storage tests: 127.0.0.1:15433
name: tayarishe-pg-test
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: app}
    ports: ["127.0.0.1:15433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app -d app"], interval: 2s, timeout: 3s, retries: 30}
    mem_limit: 512m
    tmpfs: [/var/lib/postgresql/data]
