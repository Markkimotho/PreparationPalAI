services:
  ollama:
    image: ollama/ollama:latest
    container_name: preparationpalai-ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama ps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 10g
    cpus: 4
    pids_limit: 256
    security_opt: [no-new-privileges:true]

    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: preparationpalai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Pulling qwen2.5:7b (~4.7 GB)...' &&
        ollama pull qwen2.5:7b &&
        echo 'Pulling nomic-embed-text (~274 MB)...' &&
        ollama pull nomic-embed-text &&
        echo 'All models ready.'
      "
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preparationpalai-web
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDED_WORKER=false
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - chroma_data:/app/data/chroma
      - flashcards_data:/app/data/flashcards
      - coach_data:/app/data/coach
      - jobs_data:/app/data/jobs
      - usage_data:/app/data/usage
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 180s

  worker:
    build: .
    command: [python, -m, app.jobs]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDED_WORKER=false
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - chroma_data:/app/data/chroma
      - jobs_data:/app/data/jobs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 180s
    healthcheck:
      test: [CMD, python, -c, "from app.jobs import queue_status; assert queue_status()['worker']"]
      interval: 30s
      timeout: 5s
      start_period: 30s

volumes:
  ollama_models:
  chroma_data:
  flashcards_data:
  coach_data:
  jobs_data:
  usage_data:
