global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Tayarishe FastAPI backend. Reachable as `web:8000` when this stack is
  # launched in the same Compose project (see docker-compose.monitoring.yml).
  - job_name: tayarishe-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: tayarishe-web

  # Internal billing service (credit ledger). Only reachable inside the hosted Compose network.
  - job_name: billing
    metrics_path: /metrics
    static_configs:
      - targets: ["billing:8100"]
        labels:
          service: billing
