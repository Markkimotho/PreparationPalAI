groups:
  - name: preparationpalai
    rules:
      - alert: ProviderUnavailable
        expr: preparationpalai_ollama_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ollama is unavailable; check readiness and installed models
      - alert: HighApiErrorRate
        expr: sum(rate(preparationpalai_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(preparationpalai_requests_total[5m])), 0.01) > 0.05
        for: 5m
        annotations:
          summary: API server errors exceed five percent
      - alert: SlowInference
        expr: histogram_quantile(0.95, sum by (le) (rate(preparationpalai_llm_request_duration_seconds_bucket[10m]))) > 120
        for: 10m
        annotations:
          summary: Inference p95 exceeds two minutes
      - alert: IngestionBacklog
        expr: preparationpalai_ingestion_jobs{state="pending"} > 10
        for: 5m
        annotations:
          summary: Ingestion backlog exceeds ten jobs
      - alert: IngestionWorkerUnavailable
        expr: time() - preparationpalai_worker_heartbeat_timestamp > 60
        for: 2m
        annotations:
          summary: Ingestion worker heartbeat is stale
