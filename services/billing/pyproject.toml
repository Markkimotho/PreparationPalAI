[project]
name = "billing"
version = "0.1.0"
description = "PreparationPalAI credit ledger and billing API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["billing", "billing.migrations"]

[tool.setuptools.package-data]
billing = ["prices.seed.yaml"]
"billing.migrations" = ["*.sql"]
