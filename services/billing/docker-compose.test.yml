name: billing-test
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: billing, POSTGRES_PASSWORD: test, POSTGRES_DB: billing}
    ports: ["127.0.0.1:15432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U billing -d billing"], interval: 2s, timeout: 3s, retries: 30}
    mem_limit: 256m
    tmpfs: [/var/lib/postgresql/data]
